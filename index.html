<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Flower Blooming Animation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1b1b3a 0%, #0d0d1a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #7afcff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.4);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #a0a0c0;
            margin-bottom: 15px;
            text-align: center;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(13, 13, 26, 0.7);
        }

        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            color: #c0c0e0;
        }

        .control-group label {
            margin-bottom: 3px;
        }

        input[type="range"] {
            accent-color: #ff7eb3;
            cursor: pointer;
        }

        .btn-theme {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
        }

        .btn-theme:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.5);
        }
    </style>
</head>
<body>

    <h1></h1>
    <p class="subtitle">Drag with mouse/touch to rotate view &bull; Use controls below to customize</p>

    <div class="canvas-container">
        <canvas id="flowerCanvas" width="600" height="500"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="petalsRange">Petals: <span id="petalsVal">5</span></label>
            <input type="range" id="petalsRange" min="3" max="10" value="5" step="1">
        </div>
        <div class="control-group">
            <label for="speedRange">Speed: <span id="speedVal">1.0</span>x</label>
            <input type="range" id="speedRange" min="0.2" max="3.0" value="1.0" step="0.1">
        </div>
        <button class="btn-theme" id="themeBtn">Switch Palette</button>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        const petalsRange = document.getElementById('petalsRange');
        const petalsVal = document.getElementById('petalsVal');
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const themeBtn = document.getElementById('themeBtn');

        // Color Themes
        const themes = [
            { name: "Magenta Rose", petal1: "#ff1493", petal2: "#ff69b4", center: "#ffcc00", stem: "#2e8b57" },
            { name: "Sunset Gold", petal1: "#ff4500", petal2: "#ffa500", center: "#800080", stem: "#228b22" },
            { name: "Aurora Cyan", petal1: "#00ffff", petal2: "#0080ff", center: "#ff00ff", stem: "#3cb371" },
            { name: "Royal Indigo", petal1: "#8a2be2", petal2: "#da70d6", center: "#00ffcc", stem: "#556b2f" }
        ];
        let currentThemeIndex = 0;

        // Interaction state for 3D tilt
        let rotX = 0;
        let rotY = 0;
        let isDragging = false;
        let startX, startY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            rotY += dx * 0.005;
            rotX += dy * 0.005;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let dx = e.touches[0].clientX - startX;
            let dy = e.touches[0].clientY - startY;
            rotY += dx * 0.005;
            rotX += dy * 0.005;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        themeBtn.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        });

        petalsRange.addEventListener('input', (e) => {
            petalsVal.innerText = e.target.value;
        });

        speedRange.addEventListener('input', (e) => {
            speedVal.innerText = parseFloat(e.target.value).toFixed(1);
        });

        // Floating background particles
        const particles = Array.from({ length: 40 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2.5 + 0.5,
            speedY: Math.random() * 0.5 + 0.2,
            opacity: Math.random() * 0.5 + 0.2
        }));

        let time = 0;

        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background particles
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            const speed = parseFloat(speedRange.value);
            time += 0.02 * speed;

            const theme = themes[currentThemeIndex];
            const petals = parseInt(petalsRange.value);

            // Center origin offset with smooth auto-bobbing & mouse rotation tilt
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 30;

            ctx.save();
            ctx.translate(cx, cy);

            // Apply smooth 3D tilt transformations based on mouse/touch drag
            ctx.rotate(rotY * 0.5);

            // Draw Stem & Leaves
            ctx.strokeStyle = theme.stem;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 40);
            // Gentle stem curve
            ctx.quadraticCurveTo(15, 120, 0, 180);
            ctx.stroke();

            // Draw Leaf Left
            ctx.fillStyle = theme.stem;
            ctx.beginPath();
            ctx.ellipse(-20, 110, 25, 10, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Draw Leaf Right
            ctx.beginPath();
            ctx.ellipse(15, 140, 25, 10, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Blooming factor (oscillates between 0.3 and 1.0)
            const bloomFactor = (Math.sin(time) + 1) * 0.35 + 0.3;

            // Draw Flower Petals using Rose Curve Polar Equation: r = cos(k * theta)
            const layers = 3;
            for (let l = layers; l >= 1; l--) {
                ctx.save();
                ctx.rotate(time * 0.1 * l); // Gentle rotation per layer

                const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 120);
                gradient.addColorStop(0, theme.center);
                gradient.addColorStop(0.4, l % 2 === 0 ? theme.petal1 : theme.petal2);
                gradient.addColorStop(1, theme.petal2);

                ctx.fillStyle = gradient;
                ctx.shadowColor = theme.petal1;
                ctx.shadowBlur = 15;

                ctx.beginPath();
                const step = 0.01;
                for (let theta = 0; theta <= Math.PI * 2; theta += step) {
                    // Rose curve formula
                    const r = 110 * bloomFactor * (1.2 - l * 0.15) * Math.cos(petals * theta);
                    const x = r * Math.cos(theta);
                    const y = r * Math.sin(theta);

                    if (theta === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // Draw Flower Center (Stamens & Pistil)
            ctx.shadowBlur = 0;
            ctx.fillStyle = theme.center;
            ctx.beginPath();
            ctx.arc(0, 0, 18 * bloomFactor, 0, Math.PI * 2);
            ctx.fill();

            // Center details (little sparkling dots)
            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < 8; i++) {
                const angle = i * ((Math.PI * 2) / 8) + time;
                const dist = 8 * bloomFactor;
                ctx.beginPath();
                ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
